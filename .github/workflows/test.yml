name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          gleam-version: "1.18.1"
          rebar3-version: "3.27.1"
          version-type: strict
      - run: gleam format --check src test
      - run: gleam build --warnings-as-errors
      - run: gleam test
